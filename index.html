<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>균열폭 측정기 · Crack Gauge</title>
<style>
  :root{
    /* 계측 도구의 세계 — 청사진 남색 + 계기 눈금의 앰버 */
    --ink:#0d1b2a;          /* 도면 잉크 */
    --blueprint:#12283f;    /* 청사진 바탕 */
    --panel:#f4f6f8;        /* 계측 패널 흰 */
    --paper:#fbfcfd;
    --grid:#dbe3ea;
    --amber:#e8a33d;        /* 계기 지침 */
    --amber-deep:#c8801c;
    --line:#1b3a5b;
    --ok:#2f7d5b;
    --warn:#b5851f;
    --err:#b34733;
    --muted:#6b7c8c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  /* 계기 눈금 느낌의 등폭 숫자 */
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  header{background:var(--blueprint);color:#eaf1f7;padding:18px 20px;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:22px 22px;border-bottom:2px solid var(--amber)}
  header h1{font-size:19px;font-weight:700;letter-spacing:-.2px;
    display:flex;align-items:center;gap:10px}
  header .tag{font-size:11px;color:var(--amber);letter-spacing:2px;
    text-transform:uppercase;margin-top:3px;font-weight:600}
  .gauge-ico{width:26px;height:26px;flex:none}

  main{max-width:760px;margin:0 auto;padding:16px}

  /* 상태 배너 */
  #status{font-size:13px;color:var(--muted);padding:10px 14px;
    background:var(--paper);border:1px solid var(--grid);border-radius:8px;
    margin-bottom:14px;display:flex;align-items:center;gap:8px}
  #status .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
  #status.ready .dot{background:var(--ok)}

  /* 설정 바 */
  .settings{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;
    background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:12px}
  .settings label{font-size:12px;color:var(--muted);display:flex;
    flex-direction:column;gap:4px;flex:1;min-width:120px}
  .settings input{font-size:15px;padding:8px 10px;border:1px solid var(--grid);
    border-radius:6px;background:#fff;color:var(--ink)}
  .settings input:focus{outline:none;border-color:var(--amber)}

  /* 드롭존 */
  .drop{border:2px dashed var(--line);border-radius:12px;background:var(--paper);
    padding:34px 18px;text-align:center;cursor:pointer;transition:.15s;
    position:relative;overflow:hidden}
  .drop:hover,.drop.over{border-color:var(--amber);background:#fff}
  .drop.over{box-shadow:inset 0 0 0 3px rgba(232,163,61,.15)}
  .drop svg{width:44px;height:44px;color:var(--line);margin-bottom:10px}
  .drop h2{font-size:16px;font-weight:600;margin-bottom:4px}
  .drop p{font-size:13px;color:var(--muted)}
  .drop .cam{margin-top:12px;display:inline-block;font-size:13px;
    color:var(--amber-deep);font-weight:600}
  input[type=file]{display:none}

  /* 진행 */
  #progress{margin:14px 0;display:none}
  #progress.on{display:block}
  .bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
  .bar > span{display:block;height:100%;background:var(--amber);width:0;transition:.3s}
  #progtext{font-size:12px;color:var(--muted);margin-top:6px}

  /* 결과 테이블 */
  .results{margin-top:18px;display:none}
  .results.on{display:block}
  .results h2{font-size:14px;letter-spacing:1px;text-transform:uppercase;
    color:var(--line);margin-bottom:10px;font-weight:700}
  .tablewrap{overflow-x:auto;border:1px solid var(--grid);border-radius:8px}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  th{background:var(--blueprint);color:#eaf1f7;font-weight:600;font-size:11px;
    letter-spacing:.5px;padding:9px 8px;text-align:left;white-space:nowrap}
  td{padding:8px;border-top:1px solid var(--grid);white-space:nowrap}
  tr.err td{background:#fbeae6}
  tr.warn td{background:#faf3e2}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600}
  .badge.ok{background:#e2f0ea;color:var(--ok)}
  .badge.warn{background:#f6ecd2;color:var(--warn)}
  .badge.err{background:#f6ddd6;color:var(--err)}
  .maxw{font-weight:700;color:var(--ink)}

  /* 요약 카드 */
  .summary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .card{flex:1;min-width:100px;background:var(--paper);border:1px solid var(--grid);
    border-radius:8px;padding:12px 14px;position:relative}
  .card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .card .val{font-size:24px;font-weight:700;margin-top:4px;color:var(--ink)}
  .card .val small{font-size:13px;color:var(--muted);font-weight:500}
  .card.hero{background:var(--blueprint);border-color:var(--amber)}
  .card.hero .lbl{color:var(--amber)}
  .card.hero .val{color:#fff}

  /* 상세 오버레이 모달 */
  .rowbtn{background:none;border:1px solid var(--grid);border-radius:6px;
    padding:4px 10px;font-size:12px;cursor:pointer;color:var(--line)}
  .rowbtn:hover{border-color:var(--amber);color:var(--amber-deep)}
  #modal{position:fixed;inset:0;background:rgba(13,27,42,.85);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:50}
  #modal.on{display:flex}
  #modal .box{background:#fff;border-radius:10px;max-width:92vw;max-height:88vh;
    overflow:auto;padding:14px}
  #modal img{max-width:100%;border-radius:6px;display:block}
  #modal .cap{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
  #modal .close{float:right;background:none;border:none;font-size:22px;
    cursor:pointer;color:var(--muted);line-height:1}

  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{flex:1;min-width:140px;padding:12px;border-radius:8px;font-size:14px;
    font-weight:600;cursor:pointer;border:none;text-align:center}
  .btn.primary{background:var(--amber);color:#3a2708}
  .btn.primary:hover{background:var(--amber-deep);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--line)}

  .note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6;
    background:var(--paper);border-left:3px solid var(--amber);padding:12px 14px;border-radius:0 6px 6px 0}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:24px 16px}

  canvas#work{display:none}
</style>
</head>
<body>
<header>
  <div>
    <h1>
      <svg class="gauge-ico" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M12 12l4-4M12 12l-2 4"/>
        <circle cx="12" cy="12" r="1.5" fill="var(--amber)"/>
      </svg>
      균열폭 측정기
    </h1>
    <div class="tag">Concrete Crack Gauge · 100원 기준</div>
  </div>
</header>

<main>
  <div id="status"><span class="dot"></span><span id="statustext">측정 엔진 불러오는 중…</span></div>

  <div class="settings">
    <label>동전 지름 (mm)
      <input id="coinmm" class="num" type="number" value="24.0" step="0.1" inputmode="decimal">
    </label>
    <label>잡티 제거 강도 (px²)
      <input id="minarea" class="num" type="number" value="80" step="10" inputmode="numeric">
    </label>
  </div>

  <label class="drop" id="drop" for="fileinput">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>
    </svg>
    <h2>사진을 여기에 놓으세요</h2>
    <p>여러 장 한 번에 가능 · 손가락으로 동전을 눌러 잡아도 됩니다</p>
    <span class="cam">📷 폰에서는 탭하면 카메라가 열립니다</span>
    <input id="fileinput" type="file" accept="image/*" multiple capture="environment">
  </label>

  <div id="progress">
    <div class="bar"><span id="progbar"></span></div>
    <div id="progtext"></div>
  </div>

  <div class="results" id="results">
    <div class="summary" id="summary"></div>
    <h2>측정 결과</h2>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>#</th><th>파일명</th><th>상태</th><th>최대폭</th>
          <th>평균</th><th>95%</th><th>중앙</th><th>스케일</th><th>보기</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="btn primary" id="csvbtn">CSV로 내보내기</button>
      <button class="btn ghost" id="clearbtn">모두 지우기</button>
    </div>
    <div class="note" id="disclaimer">
      <strong>참고용 스크리닝 도구입니다.</strong> 동전을 손가락으로 눌러 일부가 가려져도
      보이는 테두리로 크기를 복원합니다(둘레의 60% 이상 보이면 안정적). 각 행의 “보기”로
      동전 테두리와 균열이 제대로 잡혔는지 꼭 확인하고, 구조 판정이 필요한 균열은
      균열 게이지로 교차 검증하세요.
    </div>
  </div>
</main>

<div id="modal"><div class="box">
  <button class="close" id="modalclose">×</button>
  <img id="modalimg" alt="측정 오버레이">
  <div class="cap" id="modalcap"></div>
</div></div>

<canvas id="work"></canvas>
<footer>브라우저 안에서만 처리됩니다 · 사진은 어디로도 전송되지 않습니다</footer>

<script src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
